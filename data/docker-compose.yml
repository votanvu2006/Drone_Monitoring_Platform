name: drone-monitoring-frontend-v21
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-drone_root_password}
      MYSQL_DATABASE: ${DEMO_MYSQL_DATABASE:-drone_monitoring_frontend}
      MYSQL_USER: ${DEMO_MYSQL_USER:-drone_app}
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:-drone_app_password}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:${DEMO_MYSQL_PORT:-3307}:3306"
    volumes:
      - frontend_v21_mysql:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --batch --skip-column-names -e \"SELECT build_id FROM data_pack_metadata WHERE id=1\" | grep -qx DRONE-DATA-2.1.0-R1-20261028"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  frontend_v21_mysql:
