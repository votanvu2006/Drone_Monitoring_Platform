services:
  mysql:
    image: mysql:8.4
    container_name: drone-monitoring-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drone_monitoring}
      MYSQL_USER: ${MYSQL_USER:-drone_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drone_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-drone_root_password}
      TZ: UTC
    volumes:
      - drone_mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  drone_mysql_data:

