name: Static UI CI

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/static-ui-ci.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/static-ui-ci.yml'

permissions:
  contents: read

jobs:
  static-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
