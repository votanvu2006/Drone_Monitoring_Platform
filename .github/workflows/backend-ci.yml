name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Start MySQL with the v2.0.0 data pack
        id: mysql
        run: docker compose -f ../data/docker-compose.yml up --detach --wait --wait-timeout 120

      - name: Wait for the v2.0.0 data-pack import
        run: npm run wait:data-pack
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: drone_monitoring
          DB_USER: drone_app
          DB_PASSWORD: drone_app_password

      - name: Run data-pack verification queries
        run: docker compose -f ../data/docker-compose.yml exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --user=root' < ../data/database/verify-import.sql

      - name: MySQL integration tests
        run: npm run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: drone_monitoring
          DB_USER: drone_app
          DB_PASSWORD: drone_app_password

      - name: Build
        run: npm run build

      - name: Show MySQL logs after backend failure
        if: failure() && steps.mysql.outcome != 'skipped'
        run: docker compose -f ../data/docker-compose.yml logs --no-color mysql || true
