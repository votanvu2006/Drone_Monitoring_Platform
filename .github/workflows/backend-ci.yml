name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_NAME: drone_monitoring_frontend
      DB_USER: drone_app
      DB_PASSWORD: drone_app_password
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Check frontend snapshot
        run: node ../data/tools/check-snapshot.mjs

      - name: Start MySQL with v2.1.0 data
        id: mysql
        run: docker compose -f ../data/docker-compose.yml up --detach --wait --wait-timeout 120

      - name: Verify v2.1.0 data
        run: docker compose -f ../data/docker-compose.yml exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --user="$MYSQL_USER" --database="$MYSQL_DATABASE" -e "CALL verify_frontend_demo();"'

      - name: Wait for v2.1.0 data pack
        run: npm run wait:data-pack

      - name: MySQL integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Show MySQL logs after failure
        if: failure() && steps.mysql.outcome != 'skipped'
        run: docker compose -f ../data/docker-compose.yml logs --no-color mysql